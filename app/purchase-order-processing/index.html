<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Order Processing</title>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m,sap.f,sap.ui.core,sap.ui.layout,sap.tnt"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted"
    data-sap-ui-resourceroots='{"purchaseorderprocessing":"./"}'></script>
  <script>
    sap.ui.getCore().attachInit(function () {
      new sap.ui.core.ComponentContainer({
        name: "purchaseorderprocessing",
        height: "100%"
      }).placeAt("content");
    });
  </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content"></body>
</html>
